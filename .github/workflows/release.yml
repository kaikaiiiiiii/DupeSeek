# tag 发布：推送 v* tag 自动编译并直接发布到 GitHub Release
# 例：git tag v0.4.0 && git push origin v0.4.0
# 与 build-dev 同款 Linux runner + wine 环境；产物三平台（NSIS/AppImage/deb）
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 从 tag 提取版本号写入 package.json（v0.4 → 0.4.0）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # semver 需要三段式：v0.4 → 0.4.0（补 .0 直到三段）
          while [ "$(echo "$VERSION" | awk -F. '{print NF}')" -lt 3 ]; do VERSION="$VERSION.0"; done
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 从 change.log 提取本版本段落作为 Release 正文
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # 抽取 "## <版本号>" 段落（到下一个 "## " 为止）写入正文文件
          awk -v head="## ${VERSION}" '
            index($0, head) == 1 { flag = 1; next }
            /^## / { flag = 0 }
            flag
          ' CHANGELOG.md > RELEASE_NOTES.md
          # 段落缺失时退回占位文本（Release 仍会附自动生成的对比链接）
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "（CHANGELOG.md 中暂无 ${VERSION} 段落，请查阅仓库根目录 CHANGELOG.md）" > RELEASE_NOTES.md
          fi

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 构建
        run: npm run build

      # Linux 上打包 Windows 目标需要 wine；electron-builder 的 rcedit-ia32
      # 是 32 位程序，需启用 i386 多架构并安装 wine32（与 build-dev 相同）
      - name: 安装 wine（含 32 位支持）
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine64 wine32:i386

      # 每次调用只覆盖一个目标（多目标逗号分隔在 CLI 覆盖里会被当成单个名称）
      # Windows 双形态：NSIS 安装包 + zip 绿色版
      - name: 打包（Windows NSIS + zip + Linux AppImage/deb，dupeseek-<版本>）
        run: |
          npx electron-builder --win --publish=never -c.win.target=nsis -c.win.artifactName=dupeseek-\${version}-setup.\${ext}
          npx electron-builder --win --publish=never -c.win.target=zip -c.win.artifactName=dupeseek-\${version}-win.\${ext}
          npx electron-builder --linux --publish=never -c.linux.target=AppImage -c.linux.artifactName=dupeseek-\${version}.AppImage
          npx electron-builder --linux --publish=never -c.linux.target=deb -c.linux.artifactName=dupeseek-\${version}.deb

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec mv {} artifacts/ \;

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          generate_release_notes: true
