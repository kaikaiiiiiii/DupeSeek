# tag 发布：推送 v* tag 自动编译并直接发布到 GitHub Release
# 例：git tag v0.4 && git push origin v0.4
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 从 tag 提取版本号写入 package.json（v0.4 → 0.4.0）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # semver 需要三段式：v0.4 → 0.4.0（补 .0 直到三段）
          while [ "$(echo "$VERSION" | awk -F. '{print NF}')" -lt 3 ]; do VERSION="$VERSION.0"; done
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 构建
        run: npm run build

      - name: 打包（Windows NSIS，产物名 dupeseek-<版本>-setup.exe）
        run: npx electron-builder --win --publish=never

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
