# dev 分支自动编译：Linux runner 打包 Windows + Linux 双平台，产物名 dupeseek_dev
# macOS 无法在 Linux runner 构建（Apple 限制），如需 mac 包后续加 matrix job
# master 暂无自动编译（按需后续添加）
name: build-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 构建
        run: npm run build

      # bash 下 \${version} 转义为字面量传给 electron-builder 的占位符
      # snap 依赖 snapcraft 且 CI 上易翻车，Linux 目标限定 AppImage + deb
      - name: 打包（Windows NSIS + Linux AppImage/deb，产物名 dupeseek_dev）
        run: >
          npx electron-builder --win --linux
          -c.linux.target=AppImage,deb
          -c.win.artifactName=dupeseek_dev-setup.\${version}
          -c.linux.artifactName=dupeseek_dev-\${version}.\${ext}

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec mv {} artifacts/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: dupeseek_dev
          path: artifacts/*
          if-no-files-found: error
