# dev 分支自动编译：Linux runner 打包 Windows + Linux 双平台，产物名 dupeseek_dev
# macOS 无法在 Linux runner 构建（Apple 限制），如需 mac 包后续加 matrix job
# master 暂无自动编译（按需后续添加）
name: build-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 构建
        run: npm run build

      # Linux 上打包 Windows 目标需要 wine；electron-builder 的 rcedit-ia32
      # 是 32 位程序，需启用 i386 多架构并安装 wine32（见运行器报错提示）
      - name: 安装 wine（含 32 位支持）
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine64 wine32:i386

      # bash 下 \${version} 转义为字面量传给 electron-builder 的占位符
      # 每次调用只覆盖一个目标（逗号分隔的多目标在 CLI 覆盖里会被当成单个名称）
      # snap 依赖 snapcraft 且 CI 上易翻车，Linux 目标限定 AppImage + deb
      - name: 打包（Windows 绿色版 zip + Linux AppImage/deb，产物名 dupeseek_dev）
        run: |
          npx electron-builder --win --publish=never -c.win.target=zip -c.win.artifactName=dupeseek_dev-win.\${version}.\${ext}
          npx electron-builder --linux --publish=never -c.linux.target=AppImage -c.linux.artifactName=dupeseek_dev-\${version}.AppImage
          npx electron-builder --linux --publish=never -c.linux.target=deb -c.linux.artifactName=dupeseek_dev-\${version}.deb

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find dist -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec mv {} artifacts/ \;

      - uses: actions/upload-artifact@v7
        with:
          name: dupeseek_dev
          path: artifacts/*
          if-no-files-found: error
